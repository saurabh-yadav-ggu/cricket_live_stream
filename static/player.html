<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamBox Direct Player</title>
  
  <!-- Video.js 8 Base Stylesheet -->
  <link rel="stylesheet" href="/static/css/video-js.min.css?v=2.7.0">
  <!-- ImageKit Prebuilt Theme Stylesheet -->
  <link rel="stylesheet" href="/static/css/imagekit-theme.css?v=2.7.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .player-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .video-js {
      width: 100% !important;
      height: 100% !important;
    }
    .player-overlay-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(11, 13, 20, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      display: none;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <script src="/static/js/video.min.js?v=2.7.0"></script>
  <script src="/static/js/videojs-contrib-quality-levels.min.js?v=2.7.0"></script>
  <script src="/static/js/videojs-http-source-selector.min.js?v=2.7.0"></script>
</head>
<body>
  <div class="player-container">
    <video
      id="streamboxVideo"
      class="video-js vjs-default-skin vjs-big-play-centered"
      controls
      preload="auto"
      playsinline>
    </video>
    <div id="playerOverlayMsg" class="player-overlay-msg">Connecting to live feed...</div>
  </div>

  <script>
    (function() {
      const videoEl = document.getElementById('streamboxVideo');
      const overlayMsg = document.getElementById('playerOverlayMsg');
      let player = null;
      let currentUrl = '';
      let isFallback = false;

      function showNotice(text, duration = 3000) {
        if (!overlayMsg) return;
        overlayMsg.textContent = text;
        overlayMsg.style.display = 'block';
        if (duration > 0) {
          setTimeout(() => { overlayMsg.style.display = 'none'; }, duration);
        }
      }

      function hideNotice() {
        if (overlayMsg) overlayMsg.style.display = 'none';
      }

      // Parse query params: url, autoplay, muted, title
      const params = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
      const initialUrl = params.get('url') || '';
      const autoPlayParam = params.get('autoplay') === 'true' || params.get('autoplay') === '1';
      const mutedParam = params.get('muted') === 'true' || params.get('muted') === '1';

      player = videojs(videoEl, {
        autoplay: autoPlayParam ? (mutedParam ? 'muted' : true) : false,
        muted: mutedParam,
        controls: true,
        preload: 'auto',
        fluid: false,
        liveui: true,
        playbackRates: [0.5, 1, 1.25, 1.5, 2],
        html5: {
          vhs: {
            overrideNative: true,
            handlePartialData: true,
            experimentalBufferBasedABR: true
          }
        }
      });

      if (typeof player.qualityLevels === 'function') {
        player.qualityLevels();
      }
      if (typeof player.httpSourceSelector === 'function') {
        player.httpSourceSelector({ default: 'auto' });
      }

      player.on('loadedmetadata', () => {
        hideNotice();
        window.parent.postMessage({ type: 'streambox:ready', url: currentUrl }, '*');
      });

      player.on('playing', () => {
        hideNotice();
        window.parent.postMessage({ type: 'streambox:playing', url: currentUrl }, '*');
      });

      player.on('error', () => {
        const err = player.error();
        console.warn('[StreamBox Player Notice]', err);

        // If direct stream fails and we have not tried proxy yet, try proxy fallback
        if (!isFallback && currentUrl && !currentUrl.includes('/api/stream/proxy')) {
          isFallback = true;
          showNotice('Attempting proxy tunnel...');
          const proxyUrl = '/api/stream/proxy?url=' + encodeURIComponent(currentUrl);
          player.src({ src: proxyUrl, type: 'application/x-mpegURL' });
          player.play().catch(() => {});
        } else {
          showNotice('Stream token refreshing...');
          window.parent.postMessage({ type: 'streambox:error', error: err }, '*');
        }
      });

      function loadStream(rawUrl, shouldAutoplay = true) {
        if (!rawUrl) return;
        currentUrl = rawUrl;
        isFallback = false;
        showNotice('Loading live feed...', 2000);

        player.src({
          src: rawUrl,
          type: 'application/x-mpegURL'
        });

        if (shouldAutoplay) {
          player.play().catch(err => {
            console.log('[StreamBox Autoplay Notice]', err);
          });
        }
      }

      if (initialUrl) {
        loadStream(initialUrl, autoPlayParam);
      }

      // Handle message events from parent window
      window.addEventListener('message', (event) => {
        if (!event.data || typeof event.data !== 'object') return;
        const { action, url, autoplay, muted } = event.data;

        if (action === 'load' && url) {
          if (typeof muted === 'boolean') player.muted(muted);
          loadStream(url, autoplay !== false);
        } else if (action === 'play') {
          player.play().catch(() => {});
        } else if (action === 'pause') {
          player.pause();
        } else if (action === 'mute') {
          player.muted(true);
        } else if (action === 'unmute') {
          player.muted(false);
        }
      });
    })();
  </script>
</body>
</html>
