name: StreamBox CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ============================================================================
  test-and-validate:
    name: 🧪 Run Tests & Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: 🔍 Check Python syntax compilation
        run: |
          python -m py_compile main.py stream_sync.py

      - name: 🔎 Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,imagekit-video-player

      - name: 🧪 Run automated Pytest suite
        run: |
          pytest tests/ -v

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: streambox:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🩺 Container smoke test (Health probe)
        run: |
          docker run -d --name streambox-smoke -p 8000:8000 -e PORT=8000 streambox:test
          # Wait up to 30 seconds for container to report healthy
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health | grep -q "healthy"; then
              echo "✅ StreamBox container responded 200 OK to /health probe!"
              docker stop streambox-smoke
              docker rm streambox-smoke
              exit 0
            fi
            echo "Waiting for container to boot ($i/30)..."
            sleep 1
          done
          echo "❌ Smoke test failed: container did not become healthy."
          docker logs streambox-smoke
          docker stop streambox-smoke
          docker rm streambox-smoke
          exit 1

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # ============================================================================
  deploy-aws:
    name: 🚀 Deploy to AWS
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # AWS Authentication (Used if AWS credentials are provided)
      # ------------------------------------------------------------------------
      - name: 🔑 Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # Target 1: AWS App Runner Deployment
      # ------------------------------------------------------------------------
      - name: 🚀 Trigger AWS App Runner Deployment
        if: ${{ secrets.AWS_APP_RUNNER_ARN != '' }}
        run: |
          echo "Initiating AWS App Runner deployment for service ARN: ${{ secrets.AWS_APP_RUNNER_ARN }}"
          aws apprunner start-deployment --service-arn "${{ secrets.AWS_APP_RUNNER_ARN }}"
          echo "✅ Deployment triggered successfully on AWS App Runner!"

      # ------------------------------------------------------------------------
      # Target 2: AWS ECR Image Build & Push (for ECS / Container App Runner)
      # ------------------------------------------------------------------------
      - name: 🐳 Log in to Amazon ECR
        if: ${{ secrets.AWS_ECR_REPOSITORY != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v4

      # ------------------------------------------------------------------------
      # Target 3: AWS EC2 / Lightsail Deployment via SSH
      # ------------------------------------------------------------------------
      - name: 🖥️ Deploy to AWS EC2 / Lightsail via SSH
        if: ${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Updating StreamBox deployment on EC2..."
            DEPLOY_USER="${{ secrets.EC2_USER != '' && secrets.EC2_USER || 'ubuntu' }}"
            DEPLOY_DIR="/home/$DEPLOY_USER/cricket_live_stream"
            
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone https://github.com/saurabh-yadav-ggu/cricket_live_stream.git "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main
            
            echo "📋 Updating host Nginx reverse proxy configuration..."
            if [ -f nginx.conf ]; then
              sudo cp nginx.conf /etc/nginx/sites-available/streambox 2>/dev/null || true
              sudo nginx -t && sudo systemctl reload nginx 2>/dev/null || true
            fi
            
            echo "🐳 Restarting containers with Docker Compose..."
            docker compose down || true
            docker compose up -d --build
            
            echo "🩺 Verifying healthcheck..."
            sleep 5
            curl -f http://127.0.0.1:8000/health
            echo "✅ Deployment completed successfully on EC2!"
