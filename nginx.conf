# Nginx reverse proxy configuration for StreamBox live video streaming on AWS EC2 / Lightsail
server {
    listen 80;
    server_name _;

    # Client body and buffer tuning for HLS manifests & video chunks
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Gzip compression for text, JSON, and playlists
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.apple.mpegurl;

    # Static assets caching
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # HLS Stream Proxy & API endpoints - critical: disable buffering for live chunked playback
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Disable proxy buffering so live video chunks stream with zero latency
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check probe
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
