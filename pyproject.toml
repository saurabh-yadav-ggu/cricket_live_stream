[project]
name = "stream-video"
version = "0.1.0"
description = "StreamBox - Live Cricket & Indian Movie Streams"
readme = "README.md"
authors = [
    { name = "saurabh-yadav-ggu", email = "saurabhjlpyadav@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
]

[project.scripts]
stream-video = "stream_video:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
